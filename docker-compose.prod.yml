services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velora}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-velora_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?define POSTGRES_OWNER_PASSWORD}
    volumes:
      - velora_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-velora_owner} -d ${POSTGRES_DB:-velora}"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?define DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:?define DIRECT_URL}
      AUTH_SECRET: ${AUTH_SECRET:?define AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:?define AUTH_URL}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: ${AUTH_URL}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-Velora <no-reply@velora.test>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?define DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:?define DIRECT_URL}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-Velora <no-reply@velora.test>}
      NEXT_PUBLIC_APP_URL: ${AUTH_URL}
      OUTBOX_INTERVAL_MS: ${OUTBOX_INTERVAL_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?define DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  velora_postgres:
  caddy_data:
  caddy_config:
